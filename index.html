<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Diamonds App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0f19;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    background: #171e2e;
    border: 1px solid #293449;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    border-radius: 22px;
    margin-bottom: 18px;
}

h1 {
    font-size: 26px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aab4c5;
    font-size: 14px;
    margin-bottom: 22px;
}

.info {
    background: #222c40;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 20px;
    text-align: left;
    font-size: 14px;
    line-height: 1.9;
}

.download-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 17px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    transition: 0.2s;
}

.download-btn:hover {
    transform: scale(1.03);
    filter: brightness(1.1);
}

.footer {
    color: #7f8ba1;
    font-size: 12px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.jpeg" class="logo" alt="App Logo">

    <h1>FF Reward Portal App</h1>

    <p class="subtitle">Download the Android app</p>

    <div class="info">
        📱 Platform: Android<br>
        📦 File: APK<br>
        🔖 Version: 1.0<br>
        
    </div>

    <a class="download-btn"
       href="app.apk"
       download>
       ⬇ DOWNLOAD APK
    </a>

    <p class="footer">
        Only install apps you trust.
    </p>

</div>

</body>
</html>
